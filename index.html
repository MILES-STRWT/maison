<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maison Peluche | Alta Costura de Peluches</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-navy: #111c2e;
            --accent-gold: #c5a059;
            --bg-light: #f9f8f6;
            --text-dark: #222222;
            --text-muted: #666666;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* HEADER */
        header {
            background-color: var(--white);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eaeaea;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-container img {
            height: 60px;
            width: 60px;
            object-fit: cover;
            border-radius: 50%;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--accent-gold);
        }

        /* HERO SECTION */
        .hero {
            background-color: #2c3542;
            color: var(--white);
            text-align: center;
            padding: 120px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .hero p {
            font-size: 1.15rem;
            color: #dcdcdc;
            max-width: 650px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .btn-launch {
            background-color: var(--accent-gold);
            color: var(--white);
            padding: 15px 35px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: background 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.3);
        }

        .btn-launch:hover {
            background-color: #b38f4d;
            transform: translateY(-2px);
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }
            nav {
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo-container">
            <img src="maison.png" alt="Maison Peluche Logo">
        </div>
        <nav>
            <a href="#coleccion">Colección</a>
            <a href="#lamaison">La Maison</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1>El arte de regalar ternura</h1>
        <p>Osos de peluche hechos con alta costura, detalles exclusivos y acabados de lujo para momentos inolvidables.</p>
        <a href="#coleccion" class="btn-launch">Próximamente Lanzamiento</a>
    </section>

</body>
</html>
